name: Deploy do Staging (dev)

on:
  push:
    branches:
      - dev # staging: cada push na dev publica em dev.<domínio>

# Produção (deploy.yml) e staging fazem o build na mesma VPS de 2 GB: dois ao
# mesmo tempo estouram a memória. O grupo compartilhado faz um esperar o outro.
concurrency:
  group: vps-build
  cancel-in-progress: false

jobs:
  # Um push quebrado não pode derrubar o staging: o servidor só é tocado depois
  # que type-check, lint e testes unitários passam. Os testes de banco ficam de
  # fora porque exigem Docker e Postgres — rodam localmente (npm run test:db).
  verificar:
    name: Verificar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `postinstall` roda `prisma generate`, e prisma.config.ts exige
      # DATABASE_URL só para carregar — o valor não é usado, nada conecta aqui.
      - name: Instalar dependências
        run: npm ci
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Type-check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm test

  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: verificar

    steps:
      - name: Conectar na instância e fazer deploy
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e
            cd ~/ontime-dev

            echo "📥 Atualizando código..."
            git pull origin dev

            # O build acontece aqui, na instância: npm ci + vite build. É a etapa
            # pesada e o motivo de a máquina precisar de 2 GB de RAM.
            echo "🐳 Reconstruindo containers..."
            # Override do staging: banco no Neon, container/porta/volume próprios.
            docker compose -p ontime-dev -f docker-compose.yml -f docker-compose.staging.yml up -d --build app

            echo "🧹 Limpando imagens antigas..."
            docker image prune -f

            echo "✅ Deploy concluído!"
            docker compose -p ontime-dev -f docker-compose.yml -f docker-compose.staging.yml ps
