name: Deploy em Produção

on:
  push:
    branches:
      - main # dispara somente quando o push vai para a main

jobs:
  # Um push quebrado não pode derrubar a produção: o servidor só é tocado depois
  # que type-check, lint e testes unitários passam. Os testes de banco ficam de
  # fora porque exigem Docker e Postgres — rodam localmente (npm run test:db).
  verificar:
    name: Verificar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `postinstall` roda `prisma generate`, e prisma.config.ts exige
      # DATABASE_URL só para carregar — o valor não é usado, nada conecta aqui.
      - name: Instalar dependências
        run: npm ci
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Type-check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm test

  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: verificar

    steps:
      - name: Conectar na instância e fazer deploy
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e
            cd ~/ontime

            echo "📥 Atualizando código..."
            git pull origin main

            # O build acontece aqui, na instância: npm ci + vite build. É a etapa
            # pesada e o motivo de a máquina precisar de 2 GB de RAM.
            echo "🐳 Reconstruindo containers..."
            docker compose up -d --build

            echo "🧹 Limpando imagens antigas..."
            docker image prune -f

            echo "✅ Deploy concluído!"
            docker compose ps
