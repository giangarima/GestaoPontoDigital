services:
  postgres:
    image: postgres:16-alpine
    container_name: ponto_digital_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Só no loopback: o app fala com o banco pela rede interna do compose, e
      # numa máquina com IP público o 5432 aberto seria um convite.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Banco descartável dos testes de integração (npm run test:db). Só sobe com
  # --profile test; dados em tmpfs (memória), sem volume.
  postgres-test:
    image: postgres:16-alpine
    container_name: ponto_digital_postgres_test
    profiles: ['test']
    environment:
      POSTGRES_USER: ponto
      POSTGRES_PASSWORD: ponto
      POSTGRES_DB: ponto_test
    ports:
      - '55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ponto -d ponto_test']
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    container_name: ponto_digital_app
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: production
      PORT: ${PORT:-3050}
      # ORIGIN precisa bater EXATAMENTE com a URL pública: o adapter-node usa ela
      # no check de CSRF, e divergência faz todo POST ser rejeitado (login inclusive).
      ORIGIN: ${ORIGIN:-http://localhost:3050}
      APP_URL: ${APP_URL:-}
      # Sem default: um segredo previsível em produção assina JWT que qualquer um forja.
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      # O padrão do adapter é 512 KB, e o anexo de justificativa viaja como data
      # URL no corpo JSON (até 5 MB na tela) — sem isto, a foto volta 413.
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-8M}
      # Certificado do REP. `certs/` é gitignorado, então em servidor o caminho
      # normal é o base64, que tem prioridade sobre o path.
      COMPROVANTE_CERT_BASE64: ${COMPROVANTE_CERT_BASE64:-}
      COMPROVANTE_CERT_PASS: ${COMPROVANTE_CERT_PASS:-}
      COMPROVANTE_SKIP_SIGN: ${COMPROVANTE_SKIP_SIGN:-false}
      # Sem SMTP_HOST o link de recuperação de senha só aparece no log.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      # Só no loopback: quem atende a internet é o proxy reverso (nginx/443).
      - '127.0.0.1:${PORT:-3050}:${PORT:-3050}'
    volumes:
      # Cache dos comprovantes em PDF. O download regera do banco quando o arquivo
      # some, então isto é economia, não integridade — mas sem o volume cada deploy
      # joga fora o cache inteiro.
      - comprovantes:/app/storage

volumes:
  postgres_data:
  comprovantes:
